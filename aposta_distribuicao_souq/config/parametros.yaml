# Premissas gerais do app (editáveis na aba Configurações).
aproveitamento: 0.70
reserva_cd_pct: 0.20

# Fim do período saudável da coleção — define o horizonte da projeção.
# VERÃO YYYY-YYYY+1 encerra em 02/01 do ano seguinte; INVERNO YYYY, em 14/06.
fim_periodo_verao: 02/01
fim_periodo_inverno: 14/06

# Tetos da distribuição inicial.
cobertura_maxima_semanas: 6   # nunca mais que 6 semanas da velocidade da loja
max_por_tamanho_loja: 4       # nunca mais que 4 peças do mesmo SKU-tamanho por loja

# Escopo e sazonalidade.
min_amostra_curva: 800
desde_colecao: 2022.0

# Espelho sem data de liquidacao: se vendeu nos ultimos N dias, considera-se que
# ainda esta a full price e a janela vai ate hoje (97% da safra corrente vendeu
# nos ultimos 60 dias). Quem parou antes disso saiu de circulacao sem registro:
# a janela para na ultima venda, para nao diluir a velocidade em anos de prateleira.
dias_para_considerar_ativo: 60

# Elasticidade de crescimento (aba Configuracoes): % sobre a venda projetada
# pelos espelhos, para toda aposta (0 = repete o historico; 10 = +10%).
elasticidade_pct: 0

# Crescimento padrao por loja (aba Configuracoes): % para toda loja sem ajuste
# proprio em aceleracao_lojas (5 = cada loja vende 5% acima do historico).
crescimento_padrao_pct: 5

# Parque de lojas (aba Configuracoes). lojas_inativas: sk desligadas no modelo
# alem das fechadas na base; lojas_espelho: {sk_nova: {espelho: sk, fator: 0.75}}
# sobrepoe config/lojas_espelho.yaml (espelho vazio = regra desligada).
lojas_inativas: []
lojas_espelho: {}

# Aceleracao de venda por loja (aba Auditoria): {sk_localidade: %}.
# 100 = igual ao historico (padrao, nao precisa constar); 0 = a loja nao vai
# vender nada (sai do parque e da matriz); 120 = cresce 20% em pecas.
# Com DATABASE_URL a configuracao fica no Supabase (aposta_aceleracao_lojas);
# esta chave e so o fallback de maquina sem banco.
aceleracao_lojas: {}
